ShortDescription: Automatic lossless audio backup appliance that survives sudden power cuts and crashes.
Description: |-
  AudioGuard is a bulletproof, cross-platform audio backup utility for Windows, macOS, and Linux.
  Designed for unattended recording in live venues, lecture halls, studios, and podcast setups.
  Features continuous 1-second kernel flush (fsync) guaranteeing zero file corruption if power is cut,
  multi-slot scheduling, dynamic disk retention, and automatic companion conversions (MP3, WAV, OGG).
