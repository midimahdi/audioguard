name: Build Multiplatform Release (Windows & macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            python_arch: x64
          - arch: x86
            python_arch: x86

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (${{ matrix.python_arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Install Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verify Audio Engine & Crash Resilience
        shell: pwsh
        run: |
          python verify_engine.py

      - name: Build PyInstaller Bundles (Directory & Portable Single-File)
        shell: pwsh
        run: |
          # 1. Build Onedir Distribution Bundle
          pyinstaller --noconfirm --onedir --windowed `
            --name "AudioGuard" `
            --collect-all "customtkinter" `
            --collect-all "sounddevice" `
            --collect-all "soundfile" `
            --collect-all "pystray" `
            --collect-all "PIL" `
            main.py

          # 2. Build Portable Single-File Executable
          pyinstaller --noconfirm --onefile --windowed `
            --name "AudioGuard-Portable-${{ matrix.arch }}" `
            --collect-all "customtkinter" `
            --collect-all "sounddevice" `
            --collect-all "soundfile" `
            --collect-all "pystray" `
            --collect-all "PIL" `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile 1-Click Windows Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppArch=${{ matrix.arch }} installer/AudioGuard-Setup.iss

      - name: Package Portable & Zip Artifacts
        shell: pwsh
        run: |
          # Copy portable single-file exe into installer directory
          Copy-Item "dist\AudioGuard-Portable-${{ matrix.arch }}.exe" "dist-installer\"
          
          # Create zip archive of the directory bundle
          Compress-Archive -Path "dist\AudioGuard\*" -DestinationPath "dist-installer\AudioGuard-Bundle-${{ matrix.arch }}.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioGuard-Windows-${{ matrix.arch }}
          path: dist-installer/*

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: AppleSilicon
            os: macos-latest
          - arch: Intel
            os: macos-13

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS Application Bundle & DMG
        run: |
          bash build_mac.sh "AudioGuard-macOS-${{ matrix.arch }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioGuard-macOS-${{ matrix.arch }}
          path: dist-installer/*

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
